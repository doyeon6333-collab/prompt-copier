<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업용 프롬프트 복사기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 20px; line-height: 1.6; background: #f4f6f8; color: #1d2430;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: #fff;
    padding: 14px 16px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  h1 { font-size: 24px; margin: 0 0 10px; }
  #search {
    width: 100%; font-size: 22px; padding: 14px 16px;
    border: 2px solid #b8c2cf; border-radius: 12px;
  }
  #search:focus { outline: none; border-color: #1f6feb; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .count { color: #556; font-size: 18px; margin: 0 4px 12px; }
  .card {
    background: #fff; border-radius: 16px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .card h2 { font-size: 22px; margin: 0 0 6px; }
  .tag {
    display: inline-block; background: #e7f0ff; color: #1f4fa8;
    font-size: 17px; padding: 2px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .body {
    white-space: pre-wrap; word-break: break-word; background: #f7f8fa;
    border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; font-size: 19px;
  }
  button {
    font-size: 21px; font-weight: 700; border: none; border-radius: 12px;
    padding: 14px 18px; cursor: pointer; min-height: 56px;
  }
  .copy { width: 100%; background: #1f6feb; color: #fff; }
  .copy:active { background: #1655b8; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row button { flex: 1; }
  .edit { background: #e8ecf1; color: #1d2430; }
  .del  { background: #fde8e8; color: #b42318; }
  .primary { background: #1f6feb; color: #fff; }
  .plain { background: #e8ecf1; color: #1d2430; }
  .panel { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 16px;
           border: 2px solid #1f6feb; }
  .panel h2 { margin: 0 0 10px; font-size: 22px; }
  label { display: block; font-weight: 700; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password], textarea {
    width: 100%; font-size: 20px; padding: 12px 14px; font-family: inherit;
    border: 2px solid #b8c2cf; border-radius: 10px;
  }
  textarea { min-height: 180px; resize: vertical; }
  .msg { text-align: center; color: #556; padding: 30px 10px; }
  .err { color: #b42318; font-weight: 700; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #12805c; color: #fff; font-size: 22px; font-weight: 700;
    padding: 16px 28px; border-radius: 999px; width: max-content;
    max-width: 92vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  footer { text-align: center; padding: 10px 0 40px; }
  footer a { color: #8a94a3; font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📋 수업용 프롬프트</h1>
  <input id="search" type="search" placeholder="🔍 검색어를 입력하세요" aria-label="프롬프트 검색">
</header>

<main>
  <!-- 관리자 로그인 (주소 끝에 #admin 을 붙여야 보임) -->
  <section id="loginPanel" class="panel" hidden>
    <h2>관리자 로그인</h2>
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row">
      <button class="primary" id="loginBtn">로그인</button>
      <button class="plain" id="loginCancel">닫기</button>
    </div>
    <p id="loginMsg" class="err"></p>
  </section>

  <!-- 관리자 도구 -->
  <section id="adminBar" class="panel" hidden>
    <h2>관리자 모드</h2>
    <div class="row">
      <button class="primary" id="newBtn">＋ 추가하기</button>
      <button class="plain" id="logoutBtn">로그아웃</button>
    </div>
  </section>

  <!-- 추가 / 수정 입력창 -->
  <section id="editor" class="panel" hidden>
    <h2 id="editorTitle">새 프롬프트</h2>
    <label for="fTitle">제목</label>
    <input id="fTitle" type="text">
    <label for="fCat">분류</label>
    <input id="fCat" type="text" list="catList" placeholder="예: 글쓰기, 사진, 여행">
    <datalist id="catList"></datalist>
    <label for="fBody">프롬프트 본문</label>
    <textarea id="fBody"></textarea>
    <div class="row">
      <button class="primary" id="saveBtn">저장</button>
      <button class="plain" id="cancelBtn">취소</button>
    </div>
    <p id="editorMsg" class="err"></p>
  </section>

  <p class="count" id="count"></p>
  <div id="list"><p class="msg">불러오는 중…</p></div>
</main>

<footer><a href="#admin" id="adminLink">관리자</a></footer>
<div id="toast" role="status" aria-live="polite">복사되었습니다</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================================================================
   ▼ 여기 두 줄만 내 Supabase 값으로 바꾸세요.
   - URL : Supabase > Project Settings > API(또는 Data API) 의 Project URL
   - KEY : 공개용 키 (Publishable key 또는 anon public key)
   ※ 공개용 키는 원래 화면에 노출되어도 되는 키입니다.
     실제 권한은 Supabase의 보안 규칙(setup.sql)이 막아 줍니다.
   ※ secret / service_role 키는 절대 넣지 마세요.
   ================================================================ */
const SUPABASE_URL = "https://xqbgoaanbwkuwkwtxkwa.supabase.co";
const SUPABASE_KEY = "sb_publishable_RdL4EHNDjYWPWArXbZOKhw_ZoRrINpZ";
/* ================================================================ */

const $ = (id) => document.getElementById(id);
let db = null;
let prompts = [];
let isAdmin = false;
let editingId = null;

/* ---------- 시작 ---------- */
(async function start() {
  if (!window.supabase || !SUPABASE_URL.startsWith("https:")) {
    $("list").innerHTML = '<p class="msg err">아직 저장소가 연결되지 않았습니다.<br>index.html 안의 SUPABASE_URL 과 SUPABASE_KEY 를 입력해 주세요.</p>';
    return;
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data } = await db.auth.getSession();
  setAdmin(!!data.session);
  db.auth.onAuthStateChange((_e, session) => setAdmin(!!session));

  if (location.hash === "#admin" && !isAdmin) showLogin();
  window.addEventListener("hashchange", () => {
    if (location.hash === "#admin" && !isAdmin) showLogin();
  });

  await load();
})();

/* ---------- 불러오기 / 화면 그리기 ---------- */
async function load() {
  const { data, error } = await db.from("prompts")
    .select("id,title,category,body,created_at")
    .order("created_at", { ascending: false });
  if (error) {
    $("list").innerHTML = '<p class="msg err">목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>';
    console.error(error);
    return;
  }
  prompts = data || [];
  render();
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const shown = prompts.filter(p =>
    !q || [p.title, p.category, p.body].some(v => (v || "").toLowerCase().includes(q)));

  $("count").textContent = q ? `검색 결과 ${shown.length}개` : `전체 ${prompts.length}개`;

  if (!shown.length) {
    $("list").innerHTML = `<p class="msg">${prompts.length ? "검색 결과가 없습니다." : "등록된 프롬프트가 없습니다."}</p>`;
  } else {
    $("list").innerHTML = shown.map(p => `
      <article class="card">
        <h2>${esc(p.title)}</h2>
        ${p.category ? `<span class="tag">${esc(p.category)}</span>` : ""}
        <p class="body">${esc(p.body)}</p>
        <button class="copy" data-copy="${p.id}">📋 복사하기</button>
        ${isAdmin ? `<div class="row">
          <button class="edit" data-edit="${p.id}">수정</button>
          <button class="del" data-del="${p.id}">삭제</button>
        </div>` : ""}
      </article>`).join("");
  }

  const cats = [...new Set(prompts.map(p => p.category).filter(Boolean))];
  $("catList").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("search").addEventListener("input", render);

/* ---------- 복사 / 수정 / 삭제 버튼 ---------- */
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const find = (id) => prompts.find(p => p.id === id);

  if (b.dataset.copy) {
    const p = find(b.dataset.copy);
    if (p && await copyText(p.body)) toast("복사되었습니다");
    else toast("복사에 실패했습니다. 본문을 길게 눌러 복사해 주세요");
  }
  if (b.dataset.edit) openEditor(find(b.dataset.edit));
  if (b.dataset.del) {
    const p = find(b.dataset.del);
    if (!p || !confirm(`'${p.title}' 을(를) 삭제할까요?`)) return;
    const { error } = await db.from("prompts").delete().eq("id", p.id);
    if (error) return alert("삭제하지 못했습니다: " + error.message);
    await load();
  }
});

/* 본문만, 원래 줄바꿈 그대로 복사 */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // 오래된 휴대폰 브라우저용 예비 방법
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 관리자 로그인 ---------- */
/* 이 기기에서 마지막으로 로그인한 이메일 기억 (기기 안에만 저장, 화면 코드에는 없음) */
function savedEmail() { try { return localStorage.getItem("adminEmail") || ""; } catch { return ""; } }
function saveEmail(v) { try { localStorage.setItem("adminEmail", v); } catch {} }

function showLogin() {
  $("loginPanel").hidden = false;
  const em = savedEmail();
  if (em && !$("email").value) $("email").value = em;
  ($("email").value ? $("password") : $("email")).focus();
}
function hideLogin() {
  $("loginPanel").hidden = true; $("loginMsg").textContent = "";
  if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
}

$("adminLink").addEventListener("click", (e) => { e.preventDefault(); if (!isAdmin) showLogin(); });
$("loginCancel").addEventListener("click", hideLogin);
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "";
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value
  });
  if (error) { $("loginMsg").textContent = "로그인 실패: 이메일과 비밀번호를 확인해 주세요."; return; }
  saveEmail($("email").value.trim());
  $("password").value = "";
  hideLogin();
});

$("logoutBtn").addEventListener("click", async () => { await db.auth.signOut(); });

function setAdmin(on) {
  isAdmin = on;
  $("adminBar").hidden = !on;
  $("adminLink").hidden = on;
  if (!on) $("editor").hidden = true;
  render();
}

/* ---------- 추가 / 수정 ---------- */
$("newBtn").addEventListener("click", () => openEditor(null));
$("cancelBtn").addEventListener("click", () => { $("editor").hidden = true; });

function openEditor(p) {
  editingId = p ? p.id : null;
  $("editorTitle").textContent = p ? "프롬프트 수정" : "새 프롬프트";
  $("fTitle").value = p ? p.title : "";
  $("fCat").value = p ? p.category : "";
  $("fBody").value = p ? p.body : "";
  $("editorMsg").textContent = "";
  $("editor").hidden = false;
  $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
  $("fTitle").focus();
}

$("saveBtn").addEventListener("click", async () => {
  const row = {
    title: $("fTitle").value.trim(),
    category: $("fCat").value.trim(),
    body: $("fBody").value.replace(/\s+$/, "")   // 끝의 빈 줄만 정리, 안쪽 줄바꿈은 그대로
  };
  if (!row.title || !row.body) { $("editorMsg").textContent = "제목과 본문을 입력해 주세요."; return; }

  $("saveBtn").disabled = true;
  const res = editingId
    ? await db.from("prompts").update(row).eq("id", editingId).select()
    : await db.from("prompts").insert(row).select();
  $("saveBtn").disabled = false;

  // 보안 규칙에 막히면 오류 또는 '바뀐 줄 0개'가 돌아옴
  if (res.error || !res.data || !res.data.length) {
    $("editorMsg").textContent = "저장하지 못했습니다. 관리자 계정인지 확인해 주세요.";
    return;
  }
  $("editor").hidden = true;
  toast("저장되었습니다");
  await load();
});
</script>
</body>
</html>
